name: Catalog sync

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ptcgl
          POSTGRES_USER: ptcgl
          POSTGRES_PASSWORD: ptcgl_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptcgl -d ptcgl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ptcgl:ptcgl_local@localhost:5432/ptcgl
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Synchronize and import
        run: ptcgl-catalog sync --as-of "$(date -u +%F)" --database-url "$DATABASE_URL"
      - name: Test synchronized catalog
        run: pytest -q
      - name: Build change report
        run: ptcgl-catalog report --update-baseline
      - name: Publish report in run summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-change-report
          path: |
            reports/latest.md
            data/manifest.json
      - name: Open catalog update pull request
        run: |
          if git diff --quiet catalog/baseline.json; then
            echo "No catalog change; no pull request needed."
            exit 0
          fi
          branch="automation/catalog-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalog/baseline.json reports/latest.md
          git commit -m "Update Pokemon TCG Live catalog baseline"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "Update Pokemon TCG Live catalog baseline" \
            --body-file reports/latest.md \
            --base main \
            --head "$branch"
