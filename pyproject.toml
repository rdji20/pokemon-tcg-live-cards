[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptcgl-catalog"
version = "0.1.0"
description = "Reproducible catalog of cards playable in Pokemon TCG Live"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Personal project" }]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ptcgl-catalog = "ptcgl_catalog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ptcgl_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"src/ptcgl_catalog/live_policy.json" = "ptcgl_catalog/live_policy.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
